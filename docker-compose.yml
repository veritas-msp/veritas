# Production stack — pulls prebuilt images only (no CRA build on the server).
# For local image builds use: docker compose -f docker-compose.build.yml build

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: veritas
      POSTGRES_USER: veritas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - veritas-db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veritas -d veritas"]
      interval: 10s
      timeout: 5s
      retries: 5

  veritas-backend:
    image: ghcr.io/veritas-msp/veritas-backend:${VERITAS_IMAGE_TAG:-latest}
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://veritas:${POSTGRES_PASSWORD:-changeme}@db:5432/veritas
      NODE_ENV: production
      PROTOCOL: http
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      VERITAS_EDITION: ${VERITAS_EDITION:-community}
    volumes:
      - veritas-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  veritas-frontend:
    image: ghcr.io/veritas-msp/veritas-frontend:${VERITAS_IMAGE_TAG:-latest}
    ports:
      - "3000:80"
    depends_on:
      veritas-backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  veritas-db:
  veritas-uploads:
