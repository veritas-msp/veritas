# Optional local builds (dev/CI). Production servers should use docker-compose.yml (pull only).

services:
  veritas-backend:
    image: ghcr.io/veritas-msp/veritas-backend:${VERITAS_IMAGE_TAG:-latest}
    build: ./veritas/backend

  veritas-frontend:
    image: ghcr.io/veritas-msp/veritas-frontend:${VERITAS_IMAGE_TAG:-latest}
    build:
      context: ./veritas/frontend
      args:
        REACT_APP_API_BASE_URL: ""
        REACT_APP_VERITAS_EDITION: ${VERITAS_EDITION:-community}
